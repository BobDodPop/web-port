<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Port Game Library</title>
  <!-- Service Worker for SharedArrayBuffer / WASM multithreading support -->
  <script src="coi-serviceworker.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      height: 100vh;
      background: #121212;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
    }

    /* Sidebar Navigation */
    #sidebar {
      width: 260px;
      background: #1e1e24;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #333;
    }
    #sidebar h2 {
      padding: 16px;
      font-size: 1.2rem;
      border-bottom: 1px solid #333;
    }
    #game-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      padding: 10px;
    }
    .game-btn {
      width: 100%;
      padding: 12px;
      margin-bottom: 6px;
      background: #2a2a32;
      color: #ccc;
      border: 1px solid #3d3d4a;
      border-radius: 6px;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .game-btn:hover, .game-btn.active {
      background: #4f46e5;
      color: #fff;
    }

    /* Game Viewport Container */
    #main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    #toolbar {
      height: 48px;
      background: #1e1e24;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid #333;
    }
    #game-frame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }
    .controls button {
      background: #374151;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      margin-left: 8px;
    }
    .controls button:hover {
      background: #4b5563;
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>🕹️ Game Library</h2>
    <ul id="game-list"></ul>
  </div>

  <div id="main-content">
    <div id="toolbar">
      <span id="current-title">Select a game to play</span>
      <div class="controls">
        <button id="reload-btn">Restart</button>
        <button id="fullscreen-btn">Fullscreen</button>
      </div>
    </div>
    <iframe id="game-frame" allow="autoplay; fullscreen; gamepad; focus-without-user-activation" allowfullscreen></iframe>
  </div>

  <script>
    // List games matching folder names in web-port
    const games = [
      { id: "amanda-the-adventurer", name: "Amanda The Adventurer", path: "./amanda-the-adventurer/index.html" },
      { id: "andys-apple-farm", name: "Andy's Apple Farm", path: "./andys-apple-farm/index.html" },
      { id: "baldi-remaster", name: "Baldi's Basics Classic Remastered", path: "./baldi-remaster/index.html" },
      { id: "baldi-plus", name: "Baldi's Basics Plus", path: "./baldi-plus/index.html" },
      { id: "buckshot-roulette", name: "Buckshot Roulette", path: "./buckshot-roulette/index.html" },
      { id: "cuphead", name: "Cuphead", path: "./cuphead/index.html" },
      { id: "omori", name: "OMORI", path: "./omori/index.html" },
      { id: "pizza-tower", name: "Pizza Tower", path: "./pizza-tower/index.html" },
      { id: "raft", name: "Raft", path: "./raft/index.html" }
    ];

    const gameListEl = document.getElementById('game-list');
    const iframe = document.getElementById('game-frame');
    const titleEl = document.getElementById('current-title');

    function loadGame(game, buttonEl) {
      // Clear active styling
      document.querySelectorAll('.game-btn').forEach(btn => btn.classList.remove('active'));
      buttonEl.classList.add('active');

      // Unload existing game to free WebGL context/RAM
      iframe.src = 'about:blank';

      // Load new game path
      setTimeout(() => {
        iframe.src = game.path;
        titleEl.textContent = game.name;
      }, 50);
    }

    // Populate Sidebar
    games.forEach((game, index) => {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.className = 'game-btn';
      btn.textContent = game.name;
      btn.onclick = () => loadGame(game, btn);
      li.appendChild(btn);
      gameListEl.appendChild(li);

      // Auto-load first game
      if (index === 0) btn.click();
    });

    // Toolbar Functionality
    document.getElementById('reload-btn').onclick = () => {
      const currentSrc = iframe.src;
      iframe.src = 'about:blank';
      setTimeout(() => iframe.src = currentSrc, 50);
    };

    document.getElementById('fullscreen-btn').onclick = () => {
      if (iframe.requestFullscreen) {
        iframe.requestFullscreen();
      } else if (iframe.webkitRequestFullscreen) {
        iframe.webkitRequestFullscreen();
      }
    };
  </script>
</body>
</html>
